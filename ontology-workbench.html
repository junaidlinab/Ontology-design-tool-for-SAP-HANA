// ---------- naming helpers
const humanize = (s) => {
  const w = String(s).replace(/^_+/, "").replace(/([a-z0-9])([A-Z])/g, "$1 $2").replace(/[_\-.]+/g, " ").trim().toLowerCase();
  return w.charAt(0).toUpperCase() + w.slice(1);
};
const pascal = (s) => String(s).replace(/^_+/, "").split(/[^A-Za-z0-9]+/).filter(Boolean).map((w) => w.charAt(0).toUpperCase() + w.slice(1)).join("");
const lcFirst = (s) => s.charAt(0).toLowerCase() + s.slice(1);
const camel = (s) => lcFirst(pascal(s));
const localName = (s) => String(s || "").split(".").pop();

function xsdFor(t) {
  t = String(t || "").toLowerCase();
  if (/bool/.test(t)) return "xsd:boolean";
  if (/datetime|timestamp/.test(t)) return "xsd:dateTime";
  if (/date/.test(t)) return "xsd:date";
  if (/timeofday|\.time$/.test(t)) return "xsd:time";
  if (/int|byte/.test(t)) return "xsd:integer";
  if (/decimal|double|float|single/.test(t)) return "xsd:decimal";
  return "xsd:string";
}

// ---------- metadata parsers
function parseCSN(json) {
  const defs = json.definitions || {};
  const out = [];
  for (const [full, d] of Object.entries(defs)) {
    if (!d || d.kind !== "entity") continue;
    const attrs = [], assocs = [], keys = [];
    for (const [name, e] of Object.entries(d.elements || {})) {
      const t = e.type || "";
      if (t === "cds.Association" || t === "cds.Composition" || e.target) {
        const max = e.cardinality && e.cardinality.max;
        assocs.push({ name, target: localName(e.target), many: max === "*" || (typeof max === "number" && max > 1), composition: t === "cds.Composition", label: e["@EndUserText.label"] || "" });
      } else {
        attrs.push({ name, type: t || "cds.String", key: !!e.key, label: e["@EndUserText.label"] || e["@title"] || e["@Common.Label"] || "" });
        if (e.key) keys.push(name);
      }
    }
    out.push({ name: localName(full), full, label: d["@EndUserText.label"] || d["@title"] || d["@Common.Label"] || "", attrs, assocs, keys, annotations: Object.keys(d).filter((k) => k.startsWith("@")) });
  }
  return out;
}

function parseEDMX(text) {
  const doc = new DOMParser().parseFromString(text, "application/xml");
  if (doc.getElementsByTagName("parsererror").length) throw new Error("The file is not valid XML.");
  const tags = (node, tag) => Array.from(node.getElementsByTagNameNS("*", tag));
  const assocMap = {};
  tags(doc, "Association").forEach((a) => {
    assocMap[a.getAttribute("Name")] = tags(a, "End").map((e) => ({ role: e.getAttribute("Role"), type: localName(e.getAttribute("Type")), mult: e.getAttribute("Multiplicity") }));
  });
  return tags(doc, "EntityType").map((et) => {
    const name = et.getAttribute("Name");
    const keys = tags(et, "PropertyRef").map((p) => p.getAttribute("Name"));
    const attrs = tags(et, "Property").map((p) => ({ name: p.getAttribute("Name"), type: p.getAttribute("Type") || "Edm.String", key: keys.includes(p.getAttribute("Name")), label: p.getAttribute("sap:label") || "" }));
    const assocs = tags(et, "NavigationProperty").map((n) => {
      const t = n.getAttribute("Type");
      let target = "", many = false;
      if (t) { many = t.startsWith("Collection("); target = localName(t.replace(/^Collection\(|\)$/g, "")); }
      else {
        const rel = localName(n.getAttribute("Relationship"));
        const end = (assocMap[rel] || []).find((e) => e.role === n.getAttribute("ToRole"));
        if (end) { target = end.type; many = end.mult === "*"; }
      }
      return { name: n.getAttribute("Name"), target, many, composition: false, label: "" };
    });
    return { name, full: name, label: et.getAttribute("sap:label") || "", attrs, assocs, keys, annotations: [] };
  });
}

// ---------- ontology model helpers
const accepted = (o) => ({ classes: o.classes.filter((x) => x.accepted), oprops: o.oprops.filter((x) => x.accepted), dprops: o.dprops.filter((x) => x.accepted) });

function buildBaseline(entities, scope) {
  const inScope = entities.filter((e) => scope.includes(e.full));
  const byName = {};
  inScope.forEach((e) => (byName[e.name] = e));
  const used = new Set();
  const skipped = [];
  const classes = inScope.map((e) => {
    const id = pascal(e.name);
    used.add(id);
    return { id, label: e.label || humanize(e.name), comment: "", superClass: "", source: e.full, origin: "metadata", accepted: true };
  });
  const unique = (base, cls) => {
    let id = used.has(base) ? camel(cls) + pascal(base) : base;
    let k = 2;
    const stem = id;
    while (used.has(id)) id = stem + k++;
    used.add(id);
    return id;
  };
  const oprops = [], dprops = [];
  inScope.forEach((e) => e.assocs.forEach((a) => {
    if (!byName[a.target]) { skipped.push(`${e.name}.${a.name} points to ${a.target || "an unknown entity"}, which is outside the scope.`); return; }
    oprops.push({ id: unique(camel(a.name), e.name), label: humanize(a.name), domain: pascal(e.name), range: pascal(a.target), maxOne: !a.many, inverseOf: "", chain: null, source: `${e.full}.${a.name}`, origin: "metadata", accepted: true });
  }));
  inScope.forEach((e) => e.attrs.forEach((at) => {
    if (e.assocs.some((a) => a.target === at.name && byName[a.target])) { skipped.push(`${e.name}.${at.name} is a foreign key already covered by a relationship. It stays in the metadata for identity only.`); return; }
    const base = byName[at.name] || at.name === e.name ? camel(at.name) + "Id" : camel(at.name);
    dprops.push({ id: unique(base, e.name), label: at.label || humanize(at.name), domain: pascal(e.name), range: xsdFor(at.type), key: at.key, source: `${e.full}.${at.name}`, origin: "metadata", accepted: true });
  }));
  // pair up inverse associations (to-one on one side, to-many on the other)
  oprops.forEach((p) => {
    if (p.inverseOf || p.domain === p.range) return;
    const q = oprops.find((x) => x !== p && !x.inverseOf && x.domain === p.range && x.range === p.domain && x.maxOne !== p.maxOne);
    if (q) { p.inverseOf = q.id; q.inverseOf = p.id; }
  });
  return { onto: { classes, oprops, dprops }, skipped };
}

function renameTerm(onto, cqs, oldId, newId) {
  const fix = (v) => (v === oldId ? newId : v);
  const o = {
    classes: onto.classes.map((c) => ({ ...c, id: fix(c.id), superClass: fix(c.superClass) })),
    oprops: onto.oprops.map((p) => ({ ...p, id: fix(p.id), domain: fix(p.domain), range: fix(p.range), inverseOf: fix(p.inverseOf), chain: p.chain ? p.chain.map(fix) : null })),
    dprops: onto.dprops.map((p) => ({ ...p, id: fix(p.id), domain: fix(p.domain) })),
  };
  const re = new RegExp(`onto:${oldId}(?![A-Za-z0-9_])`, "g");
  const q = cqs.map((c) => (c.sparql ? { ...c, sparql: c.sparql.replace(re, `onto:${newId}`) } : c));
  return { onto: o, cqs: q };
}

// ---------- modelling checks (from Noy & McGuinness, plus SAP-specific ones)
function lint(onto, cqs) {
  const a = accepted(onto);
  const out = [];
  const classIds = new Set(a.classes.map((c) => c.id));
  const count = {};
  [...a.classes, ...a.oprops, ...a.dprops].forEach((x) => (count[x.id] = (count[x.id] || 0) + 1));
  Object.entries(count).filter(([, n]) => n > 1).forEach(([id]) => out.push({ sev: "error", term: id, msg: "This name is used more than once. Every class and property needs a unique name." }));
  a.classes.forEach((c) => { if (c.superClass && !classIds.has(c.superClass)) out.push({ sev: "error", term: c.id, msg: `Its parent class ${c.superClass} doesn't exist or was rejected.` }); });
  const kids = {};
  a.classes.forEach((c) => { if (c.superClass) (kids[c.superClass] = kids[c.superClass] || []).push(c.id); });
  Object.entries(kids).forEach(([p, ks]) => {
    if (ks.length === 1) out.push({ sev: "warn", term: p, msg: `${p} has only one subclass (${ks[0]}). A single child usually means the extra level adds nothing, or its siblings are missing.` });
    if (ks.length > 12) out.push({ sev: "warn", term: p, msg: `${p} has ${ks.length} direct subclasses. Intermediate groupings may make it easier to use.` });
  });
  const looped = new Set();
  a.classes.forEach((c) => {
    const seen = new Set([c.id]);
    let cur = c.superClass;
    while (cur) {
      if (seen.has(cur)) { if (!looped.has(cur)) out.push({ sev: "error", term: c.id, msg: "The class hierarchy loops back on itself here." }); looped.add(cur); break; }
      seen.add(cur);
      const nx = a.classes.find((x) => x.id === cur);
      cur = nx ? nx.superClass : "";
    }
  });
  a.classes.forEach((c) => {
    if (/(Blocked|Active|Inactive|Open|Closed|Pending|Cancel+ed|Approved|Released|Overdue|Current)/.test(c.id))
      out.push({ sev: "warn", term: c.id, msg: "This looks like a state that things move in and out of. It probably belongs as a property value, not a class." });
    if (/[^su]s$/.test(c.id) && !/is$/.test(c.id)) out.push({ sev: "info", term: c.id, msg: "Class names are usually singular. Pick one convention and keep it." });
  });
  const groups = [["customer", "businesspartner", "account", "client", "soldtoparty", "buyer"], ["supplier", "vendor"], ["product", "material", "article", "sku"], ["employee", "worker", "person"], ["plant", "site", "facility"]];
  const norm = (s) => s.toLowerCase().replace(/[^a-z]/g, "");
  for (let i = 0; i < a.classes.length; i++) for (let j = i + 1; j < a.classes.length; j++) {
    const x = norm(a.classes[i].id), y = norm(a.classes[j].id);
    if (x === y || groups.some((g) => g.includes(x) && g.includes(y)))
      out.push({ sev: "warn", term: a.classes[i].id, msg: `${a.classes[i].id} and ${a.classes[j].id} may be one concept under two names. Synonyms should be a single class.` });
  }
  a.oprops.forEach((p) => {
    if (!classIds.has(p.domain)) out.push({ sev: "error", term: p.id, msg: `Its domain ${p.domain || "(empty)"} isn't an accepted class.` });
    if (!classIds.has(p.range)) out.push({ sev: "error", term: p.id, msg: `Its range ${p.range || "(empty)"} isn't an accepted class.` });
    if (p.inverseOf && !a.oprops.find((o) => o.id === p.inverseOf)) out.push({ sev: "warn", term: p.id, msg: `Its inverse ${p.inverseOf} doesn't exist or was rejected.` });
    if (p.chain) p.chain.forEach((s) => { if (!a.oprops.find((o) => o.id === s)) out.push({ sev: "error", term: p.id, msg: `Chain step ${s} doesn't exist or was rejected.` }); });
  });
  a.dprops.forEach((p) => { if (!classIds.has(p.domain)) out.push({ sev: "error", term: p.id, msg: `Its domain ${p.domain || "(empty)"} isn't an accepted class.` }); });
  const mapped = cqs.filter((q) => q.sparql);
  if (mapped.length) {
    const text = mapped.map((q) => q.sparql).join("\n");
    const unused = [...a.classes, ...a.oprops].filter((x) => !new RegExp(`onto:${x.id}(?![A-Za-z0-9_])`).test(text)).map((x) => x.id);
    if (unused.length) out.push({ sev: "info", term: `${unused.length} terms`, msg: `No question uses ${unused.slice(0, 6).join(", ")}${unused.length > 6 ? " and others" : ""}. The ontology only needs what the questions need; keep these only if a known future question requires them.` });
  }
  return out;
}

// ---------- synthetic sample data
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const I = (v) => ({ k: "i", v });
const Lit = (v, dt) => ({ k: "l", v: String(v), dt: dt || XSD + "string" });

function sampleValue(p, i, rnd) {
  const id = p.id.toLowerCase();
  const pick = (arr) => arr[Math.floor(rnd() * arr.length)];
  const pad = (n) => String(n).padStart(2, "0");
  switch (p.range) {
    case "xsd:boolean": return Lit(String(rnd() < 0.3), XSD + "boolean");
    case "xsd:integer": return Lit(1 + Math.floor(rnd() * 99), XSD + "integer");
    case "xsd:decimal": return Lit((rnd() * 5000 + 10).toFixed(2), XSD + "decimal");
    case "xsd:date": return Lit(`2026-${pad(1 + Math.floor(rnd() * 9))}-${pad(1 + Math.floor(rnd() * 28))}`, XSD + "date");
    case "xsd:dateTime": return Lit(`2026-${pad(1 + Math.floor(rnd() * 9))}-${pad(1 + Math.floor(rnd() * 28))}T10:00:00Z`, XSD + "dateTime");
    case "xsd:time": return Lit("10:30:00", XSD + "time");
    default: break;
  }
  if (/country/.test(id)) return Lit(pick(["DE", "US", "IN", "FR", "JP"]));
  if (/city/.test(id)) return Lit(pick(["Walldorf", "Chennai", "Austin", "Lyon", "Osaka"]));
  if (/status/.test(id)) return Lit(pick(["Open", "In process", "Completed"]));
  if (/priority/.test(id)) return Lit(pick(["High", "Medium", "Low"]));
  if (/role/.test(id)) return Lit(pick(["Customer", "Supplier"]));
  if (/type|group|category|unit/.test(id)) return Lit(pick(["A", "B", "C"]) + (10 + Math.floor(rnd() * 3)));
  if (p.key || /(id|number)$/.test(id)) return Lit(String(100000 + i * 7 + Math.floor(rnd() * 5)));
  if (/name/.test(id)) return Lit(pick(["Acme Components", "Nordlicht GmbH", "Kaveri Traders", "Blue Ridge Supply", "Helvetia Tools", "Sakura Parts"]));
  return Lit(`${p.label} ${i + 1}`);
}

function synthesize(onto, base, dataBase, n) {
  const a = accepted(onto);
  const rnd = mulberry32(20260923);
  const triples = [];
  const seen = new Set();
  const add = (s, p, o) => {
    const key = s.v + "|" + p.v + "|" + o.k + o.v;
    if (seen.has(key)) return;
    seen.add(key);
    triples.push([s, p, o]);
  };
  const byId = {};
  a.classes.forEach((c) => (byId[c.id] = c));
  const anc = (id) => {
    const out = [], s = new Set();
    let cur = id;
    while (cur && byId[cur] && !s.has(cur)) { s.add(cur); out.push(cur); cur = byId[cur].superClass; }
    return out;
  };
  const hasKids = new Set(a.classes.filter((c) => c.superClass).map((c) => c.superClass));
  const concrete = a.classes.filter((c) => !(c.origin !== "metadata" && hasKids.has(c.id)));
  const typeIdx = {};
  concrete.forEach((c) => {
    for (let i = 1; i <= n; i++) {
      const s = I(dataBase + c.id + "_" + i);
      anc(c.id).forEach((t) => { add(s, I(RDF + "type"), I(base + t)); (typeIdx[t] = typeIdx[t] || []).push(s.v); });
      add(s, I(RDFS + "label"), Lit(`${c.label} ${i}`));
    }
  });
  a.dprops.forEach((p) => (typeIdx[p.domain] || []).forEach((s, i) => add(I(s), I(base + p.id), sampleValue(p, i, rnd))));
  const plain = a.oprops.filter((p) => !p.chain).sort((x, y) => Number(y.maxOne) - Number(x.maxOne));
  const done = new Set();
  plain.forEach((p) => {
    if (done.has(p.id)) return;
    done.add(p.id);
    const inv = p.inverseOf ? plain.find((o) => o.id === p.inverseOf) : null;
    if (inv) done.add(inv.id);
    const targets = typeIdx[p.range] || [];
    (typeIdx[p.domain] || []).forEach((s) => {
      const pool = targets.filter((t) => t !== s);
      if (!pool.length) return;
      const k = p.maxOne ? 1 : 1 + Math.floor(rnd() * Math.min(3, pool.length));
      const chosen = new Set();
      while (chosen.size < k) chosen.add(pool[Math.floor(rnd() * pool.length)]);
      chosen.forEach((t) => {
        add(I(s), I(base + p.id), I(t));
        if (inv) add(I(t), I(base + inv.id), I(s));
      });
    });
  });
  // materialize property chains (simulates the reasoning a store would do)
  a.oprops.filter((p) => p.chain && p.chain.length).forEach((p) => {
    let pairs = triples.filter((t) => t[1].v === base + p.chain[0]).map((t) => [t[0].v, t[2].v]);
    for (let i = 1; i < p.chain.length; i++) {
      const step = triples.filter((t) => t[1].v === base + p.chain[i]);
      const next = [];
      pairs.forEach(([s, m]) => step.forEach((t) => { if (t[0].v === m) next.push([s, t[2].v]); }));
      pairs = next;
    }
    pairs.forEach(([s, o]) => add(I(s), I(base + p.id), I(o)));
  });
  return triples;
}

// ---------- a small SPARQL engine for design-time tests
const FUNCS = ["STR", "LCASE", "UCASE", "CONTAINS", "STRSTARTS", "STRENDS", "REGEX", "BOUND", "ISIRI", "ISLITERAL"];

function tokenize(q) {
  const re = /\s+|#[^\n]*|<[^<>\s]*>|"(?:[^"\\]|\\.)*"(?:\^\^[^\s;,{}()]+|@[a-zA-Z-]+)?|'(?:[^'\\]|\\.)*'|[?$][A-Za-z_]\w*|[-+]?\d+(?:\.\d+)?(?![\w:])|!=|<=|>=|&&|\|\||[{}().;,*=<>!]|[A-Za-z_][\w-]*:[\w.-]*|:[\w.-]*|[A-Za-z_][\w-]*/y;
  const toks = [];
  let i = 0;
  while (i < q.length) {
    re.lastIndex = i;
    const m = re.exec(q);
    if (!m) throw new Error(`Unexpected text near "${q.slice(i, i + 20)}".`);
    i = re.lastIndex;
    const t = m[0];
    if (/^\s/.test(t) || t[0] === "#") continue;
    if (/^[A-Za-z_]*:[\w.-]*\.$/.test(t)) { toks.push(t.slice(0, -1)); toks.push("."); continue; }
    toks.push(t);
  }
  return toks;
}

function parseSparql(q, basePrefixes) {
  const t = tokenize(q);
  let p = 0;
  const prefixes = { ...basePrefixes };
  const peek = () => t[p];
  const next = () => t[p++];
  const up = (x) => String(x || "").toUpperCase();
  const expand = (pn) => {
    const i = pn.indexOf(":");
    const pre = pn.slice(0, i);
    if (!(pre in prefixes)) throw new Error(`Unknown prefix "${pre}:". Declare it with PREFIX.`);
    return prefixes[pre] + pn.slice(i + 1);
  };
  const term = (tok) => {
    if (tok === undefined) throw new Error("The query ended unexpectedly.");
    if (tok[0] === "?" || tok[0] === "$") return { type: "var", name: tok.slice(1) };
    if (tok[0] === "<") return { type: "iri", value: tok.slice(1, -1) };
    if (tok[0] === '"' || tok[0] === "'") {
      const m = tok.match(/^(["'])([\s\S]*)\1(?:\^\^(.+)|@(.+))?$/);
      const dt = m[3] ? (m[3][0] === "<" ? m[3].slice(1, -1) : expand(m[3])) : null;
      return { type: "lit", value: m[2].replace(/\\(.)/g, "$1"), datatype: dt };
    }
    if (/^[-+]?\d/.test(tok)) return { type: "lit", value: tok, datatype: XSD + (tok.includes(".") ? "decimal" : "integer") };
    if (tok === "true" || tok === "false") return { type: "lit", value: tok, datatype: XSD + "boolean" };
    if (tok.includes(":")) return { type: "iri", value: expand(tok) };
    throw new Error(`Unexpected "${tok}" in a triple pattern.`);
  };
  while (up(peek()) === "PREFIX") {
    next();
    const pn = next(), iri = next();
    if (!pn || !pn.endsWith(":") || !iri || iri[0] !== "<") throw new Error("A PREFIX line is malformed.");
    prefixes[pn.slice(0, -1)] = iri.slice(1, -1);
  }
  if (up(next()) !== "SELECT") throw new Error("Only SELECT queries can be tested here.");
  let distinct = false;
  if (up(peek()) === "DISTINCT") { distinct = true; next(); }
  const vars = [];
  while (peek() !== undefined && up(peek()) !== "WHERE" && peek() !== "{") {
    const v = next();
    if (v === "*") vars.push("*");
    else if (v[0] === "?" || v[0] === "$") vars.push(v.slice(1));
    else throw new Error(`"${v}" in SELECT isn't supported. The test engine returns plain variables, not aggregates or expressions.`);
  }
  if (up(peek()) === "WHERE") next();
  if (next() !== "{") throw new Error('Expected "{" to open the WHERE block.');

  const parsePrim = () => {
    const tok = peek();
    if (tok === "(") { next(); const e = parseOr(); if (next() !== ")") throw new Error('A FILTER is missing ")".'); return e; }
    if (FUNCS.includes(up(tok)) && t[p + 1] === "(") {
      next(); next();
      const args = [];
      if (peek() !== ")") { args.push(parseOr()); while (peek() === ",") { next(); args.push(parseOr()); } }
      if (next() !== ")") throw new Error(`${up(tok)}( is missing ")".`);
      return { op: "fn", name: up(tok), args };
    }
    if (tok !== undefined && /^[A-Za-z]+$/.test(tok) && t[p + 1] === "(") throw new Error(`The function ${up(tok)} isn't supported by the test engine.`);
    return { op: "term", t: term(next()) };
  };
  const parseCmp = () => {
    const l = parsePrim();
    if (["=", "!=", "<", ">", "<=", ">="].includes(peek())) { const op = next(); return { op, a: l, b: parsePrim() }; }
    return l;
  };
  const parseUnary = () => (peek() === "!" ? (next(), { op: "!", a: parseUnary() }) : parseCmp());
  const parseAnd = () => { let l = parseUnary(); while (peek() === "&&") { next(); l = { op: "&&", a: l, b: parseUnary() }; } return l; };
  const parseOr = () => { let l = parseAnd(); while (peek() === "||") { next(); l = { op: "||", a: l, b: parseAnd() }; } return l; };

  const patterns = [], filters = [];
  while (peek() !== "}") {
    if (peek() === undefined) throw new Error('The WHERE block is missing its closing "}".');
    const kw = up(peek());
    if (kw === "FILTER") {
      next();
      if (peek() !== "(") throw new Error('FILTER must be followed by "(".');
      filters.push(parsePrim());
      continue;
    }
    if (["OPTIONAL", "UNION", "MINUS", "BIND", "VALUES", "GRAPH", "SERVICE", "{"].includes(kw)) throw new Error(`${kw} isn't supported by the test engine. Rewrite the query with plain triple patterns and FILTER.`);
    if (peek() === ".") { next(); continue; }
    const s = term(next());
    for (;;) {
      const pt = next();
      const pr = pt === "a" ? { type: "iri", value: RDF + "type" } : term(pt);
      for (;;) {
        patterns.push([s, pr, term(next())]);
        if (peek() === ",") { next(); continue; }
        break;
      }
      if (peek() === ";") { next(); if (peek() === "." || peek() === "}") break; continue; }
      break;
    }
    if (peek() === ".") next();
  }
  next();
  let limit = null;
  while (p < t.length) {
    const k = up(next());
    if (k === "LIMIT") limit = parseInt(next(), 10);
    else if (k === "ORDER") { while (p < t.length && up(peek()) !== "LIMIT") next(); }
    else if (k === "GROUP" || k === "HAVING") throw new Error(`${k} BY isn't supported by the test engine.`);
  }
  return { vars, distinct, patterns, filters, limit };
}

const numLike = (s) => /^[-+]?\d+(\.\d+)?$/.test(s);
const nodeEq = (a, b) => {
  if (a.k !== b.k) return false;
  if (a.v === b.v) return true;
  return a.k === "l" && numLike(a.v) && numLike(b.v) && parseFloat(a.v) === parseFloat(b.v);
};
const toNode = (t) => (t.type === "iri" ? I(t.value) : Lit(t.value, t.datatype || XSD + "string"));
const sval = (x) => (typeof x === "boolean" ? String(x) : x.v);
const truthy = (x) => (typeof x === "boolean" ? x : x.k === "l" ? x.v !== "" && x.v !== "false" && x.v !== "0" : true);

function evalExpr(e, b) {
  switch (e.op) {
    case "term": {
      if (e.t.type === "var") { const v = b[e.t.name]; if (!v) throw new Error("unbound"); return v; }
      return toNode(e.t);
    }
    case "!": return !truthy(evalExpr(e.a, b));
    case "&&": return truthy(evalExpr(e.a, b)) && truthy(evalExpr(e.b, b));
    case "||": {
      let l = false, r = false;
      try { l = truthy(evalExpr(e.a, b)); } catch (x) { l = false; }
      try { r = truthy(evalExpr(e.b, b)); } catch (x) { r = false; }
      return l || r;
    }
    case "fn": {
      if (e.name === "BOUND") return !!(e.args[0] && e.args[0].t && b[e.args[0].t.name]);
      const v = e.args.map((x) => evalExpr(x, b));
      const s = (i) => sval(v[i]);
      switch (e.name) {
        case "STR": return Lit(s(0));
        case "LCASE": return Lit(s(0).toLowerCase());
        case "UCASE": return Lit(s(0).toUpperCase());
        case "CONTAINS": return s(0).includes(s(1));
        case "STRSTARTS": return s(0).startsWith(s(1));
        case "STRENDS": return s(0).endsWith(s(1));
        case "REGEX": return new RegExp(s(1), v[2] ? s(2) : "").test(s(0));
        case "ISIRI": return typeof v[0] !== "boolean" && v[0].k === "i";
        case "ISLITERAL": return typeof v[0] !== "boolean" && v[0].k === "l";
        default: throw new Error("unsupported");
      }
    }
    default: {
      const l = evalExpr(e.a, b), r = evalExpr(e.b, b);
      const ls = sval(l), rs = sval(r);
      const num = numLike(ls) && numLike(rs);
      const x = num ? parseFloat(ls) : ls, y = num ? parseFloat(rs) : rs;
      switch (e.op) {
        case "=": return typeof l !== "boolean" && typeof r !== "boolean" ? nodeEq(l, r) || (l.k === "l" && r.k === "l" && ls === rs) : ls === rs;
        case "!=": return !(typeof l !== "boolean" && typeof r !== "boolean" ? nodeEq(l, r) : ls === rs);
        case "<": return x < y;
        case ">": return x > y;
        case "<=": return x <= y;
        case ">=": return x >= y;
        default: throw new Error("unsupported");
      }
    }
  }
}

function runQuery(q, triples, base, knownIds) {
  const parsed = parseSparql(q, { onto: base, ex: DATA_BASE, rdf: RDF, rdfs: RDFS, xsd: XSD, owl: OWL });
  const unknown = new Set();
  const checkTerm = (t) => { if (t.type === "iri" && t.value.startsWith(base) && !knownIds.has(t.value.slice(base.length))) unknown.add(t.value.slice(base.length)); };
  parsed.patterns.forEach((tr) => tr.forEach(checkTerm));
  const byPred = {};
  triples.forEach((tr) => (byPred[tr[1].v] = byPred[tr[1].v] || []).push(tr));
  const match = (t, node, b) => {
    if (t.type === "var") {
      const cur = b[t.name];
      if (cur) return nodeEq(cur, node) ? b : null;
      return { ...b, [t.name]: node };
    }
    return nodeEq(toNode(t), node) ? b : null;
  };
  let sols = [{}];
  for (const [s, pr, o] of parsed.patterns) {
    const cands = pr.type === "iri" ? byPred[pr.value] || [] : triples;
    const out = [];
    for (const b of sols) for (const tr of cands) {
      let nb = match(s, tr[0], b);
      if (!nb) continue;
      nb = match(pr, tr[1], nb);
      if (!nb) continue;
      nb = match(o, tr[2], nb);
      if (nb) out.push(nb);
    }
    sols = out;
    if (sols.length > 20000) throw new Error("The query produces too many intermediate results for the test engine. Add more constraints.");
  }
  sols = sols.filter((b) => parsed.filters.every((f) => { try { return truthy(evalExpr(f, b)); } catch (x) { return false; } }));
  let vars = parsed.vars;
  if (!vars.length || vars.includes("*")) {
    const all = [];
    parsed.patterns.forEach((tr) => tr.forEach((t) => { if (t.type === "var" && !all.includes(t.name)) all.push(t.name); }));
    vars = all;
  }
  let rows = sols.map((b) => vars.map((v) => b[v] || null));
  if (parsed.distinct) {
    const s = new Set();
    rows = rows.filter((r) => { const k = JSON.stringify(r); if (s.has(k)) return false; s.add(k); return true; });
  }
  if (parsed.limit != null) rows = rows.slice(0, parsed.limit);
  return { vars, rows, unknown: [...unknown] };
}

// ---------- export writers
const esc = (s) => String(s).replace(/\\/g, "\\\\").replace(/"/g, '\\"').replace(/\n/g, "\\n");
const prefixBlock = (base, extra) => [`@prefix onto: <${base}> .`, `@prefix rdf: <${RDF}> .`, `@prefix rdfs: <${RDFS}> .`, `@prefix owl: <${OWL}> .`, `@prefix xsd: <${XSD}> .`, ...(extra || []), ""];

function ontologyTTL(onto, base, title) {
  const a = accepted(onto);
  const L = prefixBlock(base);
  L.push(`<${base.replace(/[#/]$/, "")}> a owl:Ontology ;`, `  rdfs:label "${esc(title)}" ;`, `  rdfs:comment "Generated at design time from SAP metadata and reviewed against competency questions." .`, "");
  L.push(`onto:sourceMetadata a owl:AnnotationProperty ;`, `  rdfs:comment "The metadata element this term was generated from." .`, "");
  a.classes.forEach((c) => {
    const parts = [`onto:${c.id} a owl:Class`, `rdfs:label "${esc(c.label)}"@en`];
    if (c.comment) parts.push(`rdfs:comment "${esc(c.comment)}"@en`);
    if (c.superClass) parts.push(`rdfs:subClassOf onto:${c.superClass}`);
    if (c.source) parts.push(`onto:sourceMetadata "${esc(c.source)}"`);
    L.push(parts.join(" ;\n  ") + " .", "");
  });
  a.oprops.forEach((p) => {
    const types = ["owl:ObjectProperty"];
    if (p.maxOne && !p.chain) types.push("owl:FunctionalProperty");
    const parts = [`onto:${p.id} a ${types.join(", ")}`, `rdfs:label "${esc(p.label)}"@en`, `rdfs:domain onto:${p.domain}`, `rdfs:range onto:${p.range}`];
    if (p.inverseOf) parts.push(`owl:inverseOf onto:${p.inverseOf}`);
    if (p.chain) parts.push(`owl:propertyChainAxiom ( ${p.chain.map((x) => "onto:" + x).join(" ")} )`);
    if (p.source) parts.push(`onto:sourceMetadata "${esc(p.source)}"`);
    L.push(parts.join(" ;\n  ") + " .", "");
  });
  a.dprops.forEach((p) => {
    const parts = [`onto:${p.id} a owl:DatatypeProperty, owl:FunctionalProperty`, `rdfs:label "${esc(p.label)}"@en`, `rdfs:domain onto:${p.domain}`, `rdfs:range ${p.range}`];
    if (p.source) parts.push(`onto:sourceMetadata "${esc(p.source)}"`);
    L.push(parts.join(" ;\n  ") + " .", "");
  });
  return L.join("\n");
}

function shapesTTL(onto, base) {
  const a = accepted(onto);
  const L = prefixBlock(base, [`@prefix sh: <${SH}> .`]);
  a.classes.forEach((c) => {
    const props = [
      ...a.dprops.filter((p) => p.domain === c.id).map((p) => `[ sh:path onto:${p.id} ; sh:datatype ${p.range} ; sh:maxCount 1${p.key ? " ; sh:minCount 1" : ""} ]`),
      ...a.oprops.filter((p) => p.domain === c.id && !p.chain).map((p) => `[ sh:path onto:${p.id} ; sh:class onto:${p.range}${p.maxOne ? " ; sh:maxCount 1" : ""} ]`),
    ];
    if (!props.length) return;
    L.push(`onto:${c.id}Shape a sh:NodeShape ;\n  sh:targetClass onto:${c.id} ;\n  sh:property\n    ${props.join(" ,\n    ")} .`, "");
  });
  return L.join("\n");
}

function queriesRQ(cqs, base) {
  return cqs.map((q, i) => {
    const head = [`# Question ${i + 1}: ${q.text}`];
    if (q.expected) head.push(`# Expected: ${q.expected}`);
    if (q.verdict) head.push(`# Design-time test: ${q.verdict}${q.verdictNote ? " (" + q.verdictNote + ")" : ""}`);
    if (!q.sparql) return [...head, `# Not answerable with this ontology.${q.missing ? " Missing: " + q.missing : ""}`].join("\n");
    const body = /PREFIX\s+onto:/i.test(q.sparql) ? q.sparql : `PREFIX onto: <${base}>\n${q.sparql}`;
    return [...head, body].join("\n");
  }).join("\n\n") + "\n";
}

const shorten = (v, base) => v.startsWith(base) ? "onto:" + v.slice(base.length) : v.startsWith(DATA_BASE) ? "ex:" + v.slice(DATA_BASE.length) : v.startsWith(RDF) ? "rdf:" + v.slice(RDF.length) : v.startsWith(RDFS) ? "rdfs:" + v.slice(RDFS.length) : v.startsWith(XSD) ? "xsd:" + v.slice(XSD.length) : `<${v}>`;

function sampleTTL(triples, base) {
  const L = prefixBlock(base, [`@prefix ex: <${DATA_BASE}> .`]);
  const bySubj = {};
  triples.forEach((t) => (bySubj[t[0].v] = bySubj[t[0].v] || []).push(t));
  Object.entries(bySubj).forEach(([s, ts]) => {
    const parts = ts.map((t) => {
      const pred = t[1].v === RDF + "type" ? "a" : shorten(t[1].v, base);
      const obj = t[2].k === "i" ? shorten(t[2].v, base) : `"${esc(t[2].v)}"^^${shorten(t[2].dt, base)}`;
      return `${pred} ${obj}`;
    });
    L.push(`${shorten(s, base)} ${parts.join(" ;\n  ")} .`, "");
  });
  return L.join("\n");
}

function decisionLogMD(log, cqs, title) {
  const L = [`# Decision log: ${title}`, "", `Generated ${new Date().toISOString().slice(0, 10)}.`, "", "## Competency questions", ""];
  cqs.forEach((q, i) => L.push(`${i + 1}. ${q.text}${q.expected ? ` (expected: ${q.expected})` : ""}${q.verdict ? ` [test: ${q.verdict}]` : ""}${!q.sparql && q.missing ? ` [gap: ${q.missing}]` : ""}`));
  L.push("", "## Decisions", "");
  log.forEach((e) => L.push(`- ${e.t.slice(0, 16).replace("T", " ")} | ${e.step} | ${e.by} | ${e.action}`));
  return L.join("\n") + "\n";
}

// ---------- model prompts
function describeOnto(onto) {
  const a = accepted(onto);
  return [
    "Classes:",
    ...a.classes.map((c) => `- ${c.id}${c.superClass ? ` subClassOf ${c.superClass}` : ""} "${c.label}"`),
    "Object properties (domain -> range):",
    ...a.oprops.map((p) => `- ${p.id}: ${p.domain} -> ${p.range}${p.maxOne ? " (at most one)" : ""}${p.inverseOf ? ` inverse of ${p.inverseOf}` : ""}${p.chain ? ` = chain(${p.chain.join(" then ")})` : ""}`),
    "Datatype properties:",
    ...a.dprops.slice(0, 150).map((p) => `- ${p.id}: ${p.domain} -> ${p.range} "${p.label}"`),
  ].join("\n");
}

function describeScope(entities, scope) {
  return entities.filter((e) => scope.includes(e.full)).map((e) =>
    `${e.name}${e.label ? ` ("${e.label}")` : ""}: fields ${e.attrs.slice(0, 12).map((a) => a.name).join(", ")}; links ${e.assocs.map((a) => `${a.name} -> ${a.target}${a.many ? " (many)" : ""}`).join(", ") || "none"}`
  ).join("\n");
}

function parseJSONLoose(text) {
  const clean = String(text).replace(/```json|```/g, "").trim();
  const s = clean.search(/[[{]/);
  const e = Math.max(clean.lastIndexOf("}"), clean.lastIndexOf("]"));
  if (s < 0 || e < s) throw new Error("The model didn't return JSON.");
  return JSON.parse(clean.slice(s, e + 1));
}

async function askClaude(prompt) {
  if (!API_KEY) throw new Error("Add your Anthropic API key at the top of the page to use Claude.");
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": API_KEY,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({ model: MODEL, max_tokens: 4000, messages: [{ role: "user", content: prompt }] }),
  });
  if (!res.ok) {
    let detail = "";
    try { const j = await res.json(); detail = j.error && j.error.message ? ` ${j.error.message}` : ""; } catch (e) {}
    if (res.status === 401) throw new Error("The API key was rejected. Check it and paste it again.");
    throw new Error(`The model request failed with status ${res.status}.${detail}`);
  }
  const data = await res.json();
  return (data.content || []).filter((b) => b.type === "text").map((b) => b.text).join("\n");
}

function download(name, text) {
  const blob = new Blob([text], { type: "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1500);
}
